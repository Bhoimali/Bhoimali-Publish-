<div id="PIDCardBox" style="position:relative; width:100%; min-height:700px;">

    <div id="PIDLoader" class="pid-loader">
        <div class="spinner-border text-primary"></div>
        <div>PID Card लोड हो रहा है...</div>
    </div>

    <iframe
        id="PIDCardFrame"
        width="100%"
        height="700"
        frameborder="0">
    </iframe>

</div>

<style>
#PIDCardBox {
    position: relative;
}

.pid-loader {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 700px;
    background: #fff;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 100;
}

.pid-loader .spinner-border {
    width: 3rem;
    height: 3rem;
}

#PIDCardFrame {
    display: block;
}
</style>

<script>
const PIDCardFrame = document.getElementById("PIDCardFrame");
const PIDLoader = document.getElementById("PIDLoader");

// iframe load होने पर loader हटाएँ
PIDCardFrame.addEventListener("load", function () {
    PIDLoader.style.display = "none";
});
</script>
