<!-- PID CARD PAGE -->
<!-- ============================= -->

<section id="PIDCard" class="content">

    <!-- PID CARD LOADER -->
    <div id="PIDCardLoader" class="pid-card-loader">

        <div class="pid-spinner"></div>

        <div class="pid-loader-text">
            PID Card लोड हो रहा है...
        </div>

    </div>

</section>


<style>

/* =================================
   PID CARD LOADER
================================= */

#PIDCard {
    width: 100%;
    min-height: 700px;
    position: relative;
}


/* Loader */

.pid-card-loader {

    width: 100%;
    min-height: 700px;

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: center;

    background: #ffffff;

    text-align: center;

}


/* Spinner */

.pid-spinner {

    width: 50px;

    height: 50px;

    border: 5px solid #e5e5e5;

    border-top: 5px solid #0d6efd;

    border-radius: 50%;

    animation: pidSpin 0.8s linear infinite;

}


/* Text */

.pid-loader-text {

    margin-top: 15px;

    font-size: 16px;

    color: #333;

    font-weight: 500;

}


/* Animation */

@keyframes pidSpin {

    0% {
        transform: rotate(0deg);
    }

    100% {
        transform: rotate(360deg);
    }

}


/* Mobile */

@media (max-width: 576px) {

    #PIDCard {

        min-height: 600px;

    }

    .pid-card-loader {

        min-height: 600px;

    }

    .pid-spinner {

        width: 42px;

        height: 42px;

    }

    .pid-loader-text {

        font-size: 14px;

    }

}

</style>
