<!-- Loader -->
<div id="PIDLoader" class="pid-loader">
  <div class="spinner-border text-primary" role="status"></div>
  <div>PID Card लोड हो रहा है...</div>
</div>

<!-- Iframe -->
<iframe
  id="PIDCardFrame"
  width="100%"
  height="700"
  frameborder="0"
  style="display:none;">
</iframe>

<style>
.pid-loader {
  height: 700px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 10px;
}
</style>

<script>
const PIDCardFrame = document.getElementById("PIDCardFrame");
const PIDLoader = document.getElementById("PIDLoader");

// आपकी file
PIDCardFrame.src = "PIDCard.html";

// File load होने के बाद loader हटेगा
PIDCardFrame.onload = function () {
  PIDLoader.style.display = "none";
  PIDCardFrame.style.display = "block";
};
</script>
