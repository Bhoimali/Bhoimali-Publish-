<div id="PIDLoader" class="pid-loader">
  <div class="spinner-border text-primary"></div>
  <div>PID Card लोड हो रहा है...</div>
</div>

<iframe
  id="PIDCardFrame"
  width="100%"
  height="700"
  frameborder="0"
  style="display:none;">
</iframe>

<style>
.pid-loader {
  height: 700px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 12px;
  font-size: 16px;
}
</style>

<script>
const frame = document.getElementById("PIDCardFrame");
const loader = document.getElementById("PIDLoader");

frame.onload = function () {
  loader.style.display = "none";
  frame.style.display = "block";
};
</script>
