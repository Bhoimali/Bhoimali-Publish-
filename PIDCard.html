<div id="PIDCardBox">

    <!-- Loader -->
    <div id="PIDLoader" class="pid-loader">
        <div class="spinner-border text-primary" role="status"></div>
        <div>PID Card लोड हो रहा है...</div>
    </div>

    <!-- PID Card -->
    <iframe
        id="PIDCardFrame"
        src="pid-card.html"
        width="100%"
        height="700"
        frameborder="0">
    </iframe>

</div>

<style>
#PIDCardBox {
    position: relative;
    width: 100%;
    min-height: 700px;
}

#PIDCardFrame {
    display: block;
    width: 100%;
    height: 700px;
    border: 0;
}

.pid-loader {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 700px;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    background: #fff;
    z-index: 10;
}

.pid-loader .spinner-border {
    width: 3rem;
    height: 3rem;
}

.pid-loader div:last-child {
    margin-top: 12px;
    font-size: 16px;
}
</style>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const pidFrame = document.getElementById("PIDCardFrame");
    const pidLoader = document.getElementById("PIDLoader");

    pidFrame.addEventListener("load", function () {
        pidLoader.style.display = "none";
    });

});
</script>
